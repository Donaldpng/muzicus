[package]
name = "muzicus"
version = "0.1.3"
description = "MUZICUS — free music player"
authors = ["muzicus"]
edition = "2021"

[lib]
name = "muzicus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
rustypipe = { version = "*", default-features = false, features = ["rustls-tls-native-roots"] }
lofty = "*"
regex = "1"
once_cell = "1"
futures-util = "0.3"
urlencoding = "2"
http = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.9", default-features = false, features = ["bindgen"] }
